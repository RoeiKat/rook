services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rook
      POSTGRES_USER: rook
      POSTGRES_PASSWORD: rook
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rook"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://rook:rook@postgres:5432/rook
      FRONTEND_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  postgres_data:
  frontend_node_modules:
